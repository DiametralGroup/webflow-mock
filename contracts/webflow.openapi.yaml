            rabotée), `offset` négatif ou illisible. Code `validation_error`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '401':
          description: Jeton absent, invalide ou révoqué — les trois cas sont indistincts.
            Code `not_authorized`. N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '403':
          description: Le jeton ne porte pas le scope requis. Code `missing_scopes`,
            et le message NOMME les scopes manquants. N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '404':
          description: Ressource inconnue, ou hors du périmètre du jeton. Code `resource_not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '409':
          description: 'Formulaires seulement : le site doit être republié pour que
            la fonctionnalité soit disponible. Code `forms_require_republish`. Rien
            côté client ne le résout.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '429':
          description: Limite de débit atteinte — 60 requêtes / minute au jeton. Code
            `too_many_requests`, en-tête `Retry-After` (typiquement 60). Les en-têtes
            `X-RateLimit-Limit` et `X-RateLimit-Remaining` sont présents sur TOUTES
            les réponses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '500':
          description: Panne injectée. Code `internal_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '503':
          description: Panne transitoire injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
