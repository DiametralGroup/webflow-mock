  /v2/sites/{site_id}/pages:
    get:
      tags:
      - Pages
      summary: Les pages d'un site
      operationId: pages_v2_sites__site_id__pages_get
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          title: Site Id
      - name: localeId
        in: query
        required: false
        schema:
          type: string
        description: 'La locale des pages demandées ; la primaire par défaut. Une
          page est UNE entité : même `id` dans chaque locale.'
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Décalage de pagination. Défaut 0. Un offset au-delà du total
          rend une page vide.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Taille de page. Défaut 100, entre 1 et 100. Hors bornes → 400
          `validation_error`.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
