openapi: 3.1.0
info:
  title: Webflow Data API v2 — mock
  description: Mock de la Data API Webflow v2 (lecture seule) sur le site vitrine
    de « Boréal Conseil ». Pagination `offset`/`limit`/`total`, identifiants en chaînes,
    erreurs `{message, code, externalReference, details}`, scopes granulaires, soumissions
    de formulaires nominatives.
  version: 0.1.0
servers:
- url: https://api.webflow.com
paths:
  /v2/token/authorized_by:
    get:
      tags:
      - Token
      summary: L'utilisateur qui a autorisé le jeton
      operationId: authorized_by_v2_token_authorized_by_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '400':
          description: 'Paramètre invalide : `limit` hors bornes (elle n''est PAS
            rabotée), `offset` négatif ou illisible. Code `validation_error`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '401':
          description: Jeton absent, invalide ou révoqué — les trois cas sont indistincts.
            Code `not_authorized`. N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '403':
          description: Le jeton ne porte pas le scope requis. Code `missing_scopes`,
            et le message NOMME les scopes manquants. N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '404':
          description: Ressource inconnue, ou hors du périmètre du jeton. Code `resource_not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '409':
          description: 'Formulaires seulement : le site doit être republié pour que
            la fonctionnalité soit disponible. Code `forms_require_republish`. Rien
            côté client ne le résout.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '429':
          description: Limite de débit atteinte — 60 requêtes / minute au jeton. Code
            `too_many_requests`, en-tête `Retry-After` (typiquement 60). Les en-têtes
            `X-RateLimit-Limit` et `X-RateLimit-Remaining` sont présents sur TOUTES
            les réponses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '500':
          description: Panne injectée. Code `internal_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
        '503':
          description: Panne transitoire injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurWebflow'
  /v2/token/introspect:
    get:
      tags:
      - Token
      summary: Ce que le jeton peut faire, et sur quoi
      description: 'Le test de fumée d''un connecteur : quels scopes, quels sites
        ?


        Aucun scope requis — c''est justement lui qui sert à découvrir les scopes

        dont on dispose. Un connecteur doit l''appeler AVANT d''ouvrir son pipeline
        :

        échouer sur une authentification vaut mieux qu''un run à moitié fait.'
