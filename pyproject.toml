[project]
name = "webflow-mock"
version = "0.2.0"
description = "Webflow Data API v2 mock — the showcase website of the Boréal Conseil world"
readme = "README.md"
requires-python = ">=3.12"
# Le périmètre des dépendances est une décision, pas un accident : FastAPI et
# uvicorn, rien d'autre. La pagination est par offset (deux entiers), et
# l'authentification est un Bearer statique : aucune crypto tierce n'est
# nécessaire.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
webflow-mock = "webflow_mock.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webflow_mock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
# PLR0913/PLR2004 : un mock manipule des seuils et des formes verbeuses par
# nature ; PLC0415 : les imports différés sont délibérés (montage conditionnel
# de /__admin, cycle state ↔ dataset ↔ settings).
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Les tables du jeu de données (pages, articles, offres) se lisent en LIGNES :
# une entrée par ligne, quitte à dépasser cent colonnes. Les couper les
# rendrait illisibles sans rien apporter.
"src/webflow_mock/dataset/realiste.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/webflow_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
pythonpath = ["."]
