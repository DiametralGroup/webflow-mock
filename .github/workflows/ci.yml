name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/webflow_mock
      - run: uv run pytest tests/

  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build local pour le smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: webflow-mock:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — l'image doit démarrer et parler le dialecte
        run: |
          docker run -d --rm --name smoke -p 8000:8000 webflow-mock:smoke
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          BASE=http://localhost:8000/v2
          # Sans bearer, la surface rend le 401 de Webflow — jamais un
          # {"detail"} FastAPI.
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/sites)" = "401"
          curl -s $BASE/sites | grep -q '"code":"not_authorized"'
          # Une route inconnue rend l'enveloppe Webflow, pas le 404 FastAPI.
          curl -s $BASE/nimportequoi -H 'Authorization: Bearer mock-webflow-token' \
            | grep -q '"code":"resource_not_found"'
          # L'enveloppe à offset, et les en-têtes de débit sur une réponse SAINE.
          SITE=$(curl -s -H 'Authorization: Bearer mock-webflow-token' $BASE/sites \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sites"][0]["id"])')
          curl -s -D /tmp/h -H 'Authorization: Bearer mock-webflow-token' \
            "$BASE/sites/$SITE/pages?limit=2" | grep -q '"pagination":{"limit":2,"offset":0,"total":'
          grep -qi '^x-ratelimit-limit:' /tmp/h
          # `limit` au-delà du plafond : RABOTÉ en silence à 100 (sondé le
          # 2026-09-25) ; nul ou illisible : 400 `validation_error`.
          curl -s -H 'Authorization: Bearer mock-webflow-token' \
            "$BASE/sites/$SITE/pages?limit=9999" | grep -q '"pagination":{"limit":100,'
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer mock-webflow-token' "$BASE/sites/$SITE/pages?limit=0")" = "400"
          # Un site token n'a pas d'introspection : 500, jamais un 200 menteur.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer mock-webflow-token' "$BASE/token/introspect")" = "500"
          docker stop smoke
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
